<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>(￣o￣) zzZ💤</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Helvetica Neue", "Hiragino Sans", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #111;
      line-height: 1.6;
      min-height: 100vh;
      overflow-x: hidden;

      /* ========== 可替换背景 ========== */
      background: #fff;

      /*
      background-image: 
        linear-gradient(rgba(255,255,255,0.92), rgba(255,255,255,0.92)),
        url("你的图片地址.jpg");
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      */
    }

    /* ========== 顶部导航 ========== */
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid #eee;
    }

    .nav-container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 32px;
      height: 64px;
      display: flex;
      align-items: center;
      gap: 40px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: #111;
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      transition: opacity 0.25s;
    }

    .logo:hover {
      opacity: 0.6;
    }

    .logo-icon {
      width: 28px;
      height: 28px;
      border: 1.5px solid #111;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
    }

    .nav-links {
      display: flex;
      gap: 28px;
      list-style: none;
    }

    .nav-links a {
      color: #555;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 400;
      position: relative;
      padding: 4px 0;
      transition: color 0.25s;
    }

    .nav-links a::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 1px;
      background: #111;
      transition: width 0.3s ease;
    }

    .nav-links a:hover {
      color: #111;
    }

    .nav-links a:hover::after {
      width: 100%;
    }

    .menu-toggle {
      display: none;
      flex-direction: column;
      gap: 5px;
      background: none;
      border: none;
      padding: 4px;
      margin-left: auto;
      cursor: pointer;
    }

    .menu-toggle span {
      display: block;
      width: 20px;
      height: 1.5px;
      background: #111;
      transition: all 0.3s;
    }

    /* ========== 主视觉（打字机置顶） ========== */
    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 140px 32px 80px;
    }

    .greeting {
      font-size: 0.8rem;
      color: #888;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 16px;
      opacity: 0;
      animation: fadeIn 0.7s ease forwards 0.15s;
    }

    .main-title {
      font-size: clamp(2.4rem, 5.5vw, 4rem);
      font-weight: 500;
      letter-spacing: -0.5px;
      color: #111;
      margin-bottom: 48px;
      min-height: 1.25em;
      line-height: 1.2;
      text-align: center;
    }

    .typing-text {
      display: inline;
    }

    .cursor {
      display: inline-block;
      width: 2px;
      height: 1em;
      background: #111;
      margin-left: 3px;
      vertical-align: middle;
      animation: blink 0.9s step-end infinite;
    }

    /* ========== 列表区域 ========== */
    .content-list {
      width: 100%;
      max-width: 720px;
      opacity: 0;
      animation: fadeIn 0.8s ease forwards 0.8s;
    }

    .list-group {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 8px 32px;
      margin-bottom: 48px;
    }

    .list-group a {
      color: #555;
      text-decoration: none;
      font-size: 0.95rem;
      padding: 10px 0;
      border-bottom: 1px solid transparent;
      transition: color 0.25s, border-color 0.25s;
      display: inline-block;
    }

    .list-group a:hover {
      color: #111;
      border-bottom-color: #111;
    }

    .list-divider {
      width: 100%;
      height: 1px;
      background: #eee;
      margin: 8px 0 40px;
    }

    .timeline-title {
      font-size: 0.8rem;
      color: #999;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .timeline-title::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #eee;
    }

    .timeline-item {
      display: flex;
      gap: 24px;
      padding: 18px 0;
      border-bottom: 1px solid #f0f0f0;
      align-items: baseline;
      transition: background 0.2s;
    }

    .timeline-item:hover {
      background: #fafafa;
    }

    .timeline-date {
      font-size: 0.85rem;
      color: #999;
      min-width: 48px;
      flex-shrink: 0;
    }

    .timeline-tag {
      font-size: 0.75rem;
      color: #666;
      background: #f5f5f5;
      padding: 3px 10px;
      border-radius: 2px;
      white-space: nowrap;
    }

    .timeline-text {
      font-size: 0.95rem;
      color: #333;
      flex: 1;
    }

    .timeline-text a {
      color: inherit;
      text-decoration: none;
      transition: color 0.2s;
    }

    .timeline-text a:hover {
      color: #111;
      text-decoration: underline;
    }

    /* ========== 点击涟漪 ========== */
    .click-ripple {
      position: fixed;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.07);
      pointer-events: none;
      z-index: 9997;
      transform: translate(-50%, -50%) scale(0);
      animation: ripple 0.55s ease-out forwards;
    }

    @keyframes ripple {
      to {
        transform: translate(-50%, -50%) scale(1);
        opacity: 0;
      }
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(14px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ========== 响应式 ========== */
    @media (max-width: 768px) {
      .nav-container {
        gap: 20px;
      }

      .nav-links {
        position: fixed;
        top: 64px;
        left: 0;
        width: 100%;
        background: #fff;
        flex-direction: column;
        align-items: flex-start;
        padding: 24px 32px;
        gap: 18px;
        transform: translateY(-120%);
        transition: transform 0.3s ease;
        border-bottom: 1px solid #eee;
      }

      .nav-links.active {
        transform: translateY(0);
      }

      .menu-toggle {
        display: flex;
      }

      .menu-toggle.active span:nth-child(1) {
        transform: translateY(6.5px) rotate(45deg);
      }
      .menu-toggle.active span:nth-child(2) {
        opacity: 0;
      }
      .menu-toggle.active span:nth-child(3) {
        transform: translateY(-6.5px) rotate(-45deg);
      }

      .list-group {
        grid-template-columns: 1fr 1fr;
        gap: 4px 20px;
      }

      .timeline-item {
        flex-direction: column;
        gap: 6px;
      }

      .timeline-date {
        min-width: auto;
      }
    }
  </style>
</head>
<body>

  <!-- 顶部导航 -->
  <header>
    <div class="nav-container">
      <a href="#" class="logo">

        ૮ ˶ᵔ ᵕ ᵔ˶ ა
      </a>
      <ul class="nav-links" id="navLinks">
        <li><a href="#home">首页</a></li>
        <li><a href="#software">软件</a></li>
        <li><a href="#files">资源</a></li>
        <li><a href="#blog">推文</a></li>
        <li><a href="contact.htm">联系</a></li>
      </ul>
      <button class="menu-toggle" id="menuToggle" aria-label="菜单">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </header>

  <!-- 主视觉：打字机置顶 + 列表 -->
  <section class="hero" id="home">
    <p class="greeting">歡迎你嚟^_^</p>
    <h1 class="main-title">
      <span class="typing-text" id="typingText"></span><span class="cursor"></span>
    </h1>

    <!-- 列表区域 -->
    <div class="content-list">
      <!-- 分类列表 -->
      <div class="list-group">
        <a href="#works">作品</a>
        <a href="#projects">脚本</a>
        <a href="#writing">文章</a>
        <a href="#notes">笔记</a>
        <a href="#events">讯息</a>
        <a href="#about">关于</a>
        <a href="#contact">联系</a>
        <a href="#archive">归档</a>
      </div>

      <div class="list-divider"></div>

      <!-- 时间线列表示例 -->
      <div class="timeline-title">最近更新</div>

      <div class="timeline-item">
        <span class="timeline-date">08月</span>
        <span class="timeline-tag">讯息</span>
        <div class="timeline-text">
          <a href="#"></a>
        </div>
      </div>

      <div class="timeline-item">
        <span class="timeline-date">08月</span>
        <span class="timeline-tag">项目</span>
        <div class="timeline-text">
          <a href="#">个人网站重构完成</a>
        </div>
      </div>

      <div class="timeline-item">
        <span class="timeline-date">08月</span>
        <span class="timeline-tag">笔记</span>
        <div class="timeline-text">
          <a href="#"></a>
        </div>
      </div>

      <div class="timeline-item">
        <span class="timeline-date">08月</span>
        <span class="timeline-tag">活动</span>
        <div class="timeline-text">
          <a href="#"></a>
        </div>
      </div>

      <div class="timeline-item">
        <span class="timeline-date">08月</span>
        <span class="timeline-tag">作品</span>
        <div class="timeline-text">
          <a href="#"></a>
        </div>
      </div>
    </div>
  </section>

  <script>
    // 点击涟漪
    document.addEventListener("click", (e) => {
      const ripple = document.createElement("div");
      ripple.className = "click-ripple";
      ripple.style.left = e.clientX + "px";
      ripple.style.top = e.clientY + "px";
      ripple.style.width = "60px";
      ripple.style.height = "60px";
      document.body.appendChild(ripple);
      setTimeout(() => ripple.remove(), 550);
    });

    // 打字机效果
    const texts = [
      "Hello World: )",
      "哈囉₍ᐢ.ˬ.ᐢ₎♡~",
      "🎀真実はいつもひとつ⚽",
      "탐험은 결코 끝나지 않는다"
    ];

    const typingEl = document.getElementById("typingText");
    let textIndex = 0;
    let charIndex = 0;
    let isDeleting = false;
    let typingSpeed = 110;

    function type() {
      const currentText = texts[textIndex];

      if (isDeleting) {
        typingEl.textContent = currentText.substring(0, charIndex - 1);
        charIndex--;
        typingSpeed = 45;
      } else {
        typingEl.textContent = currentText.substring(0, charIndex + 1);
        charIndex++;
        typingSpeed = 110;
      }

      if (!isDeleting && charIndex === currentText.length) {
        typingSpeed = 2000;
        isDeleting = true;
      } else if (isDeleting && charIndex === 0) {
        isDeleting = false;
        textIndex = (textIndex + 1) % texts.length;
        typingSpeed = 500;
      }

      setTimeout(type, typingSpeed);
    }

    window.addEventListener("load", () => {
      setTimeout(type, 600);
    });

    // 移动端菜单
    const menuToggle = document.getElementById("menuToggle");
    const navLinks = document.getElementById("navLinks");

    menuToggle.addEventListener("click", () => {
      menuToggle.classList.toggle("active");
      navLinks.classList.toggle("active");
    });

    navLinks.querySelectorAll("a").forEach(link => {
      link.addEventListener("click", () => {
        menuToggle.classList.remove("active");
        navLinks.classList.remove("active");
      });
    });
  </script>
</body>
</html>
